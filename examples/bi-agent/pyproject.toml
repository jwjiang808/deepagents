[project]
name = "bi-agent-demo"
version = "0.1.0"
description = "An extensible BI multi-agent system built on deepagents for complex business intelligence Q&A"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.5.0",
    "langchain>=1.2.3",
    "langchain-anthropic>=1.3.1",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=1.0.6",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Repository = "https://github.com/jwjiang808/deepagents/tree/main/examples/bi-agent"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
